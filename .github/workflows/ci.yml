name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock', 'Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          pod install

      - name: Generate OctoConfig.xcconfig for CI build
        # OctoConfig.xcconfig is gitignored but referenced as baseConfigurationReference
        # in extension targets; xcodebuild fails if the file is absent.
        # Copying the template with placeholder values satisfies the reference.
        run: cp OctoConfig.xcconfig.template OctoConfig.xcconfig

      - name: Assert iOS SDK >= 26
        # macos-latest 是漂移标签，绿不等于跑在 iOS 26 SDK 上。若 runner
        # 回落到旧镜像，AFNetworking netinet6/in6.h 的 #error 根因不会触发，
        # build 假绿 → 补丁形同虚设。这里显式断言 iphonesimulator SDK 主版本
        # ≥ 26，不满足直接 fail（根因未覆盖）。
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iphonesimulator SDK version: ${SDK_VERSION}"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "${SDK_MAJOR}" -lt 26 ]; then
            echo "::error::iphonesimulator SDK major ${SDK_MAJOR} < 26 — runner drifted to an older image; AFNetworking iOS 26 #error root cause is NOT covered, a green build here would be a false green."
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -workspace OctoiOS.xcworkspace \
            -scheme 'OctoiOS' \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
